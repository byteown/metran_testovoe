[project]
name = "fin-agent"
version = "0.1.0"
description = "Metran test"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sentence-transformers>=6.0.1",
    "starlette>=1.6.0",
    "typer>=0.27.2",
    "uvicorn>=0.53.0",
]

[project.scripts]
fin-agent = "fin_agent:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
